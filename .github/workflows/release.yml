# release.yml — build the WHOLE of aeo (the aeo-agent binaries AND the aeo CLI
# bundles) and publish them all to ONE GitHub Release.
#
# UNIFIED, LOCKSTEP versioning: a single `v*` tag (e.g. v0.2.0) builds every
# asset and cuts one release carrying all of them. This replaces the former
# split lines (aeo-agent-v* + aeo-v*), so the agent and CLI now share a counter
# and ship together. workflow_dispatch is a BUILD-ONLY dry run (no publish).
#
# TWO artifact families in one release:
#
#   aeo-agent — a self-contained in-guest agent BINARY a guest fetches via
#   cloud-init (or ssh push) to complete its node and run its workload. Four
#   platform assets + .sha256:
#     agent-build-linux       native x86_64, STATIC (gcc -static). Load-bearing.
#     agent-build-linux-arm64 native aarch64 on an arm64 runner, STATIC.
#     agent-build-freebsd     x86_64 FreeBSD, zig-cross. Serves bhyve guests.
#     agent-build-windows     x86_64 Windows, zig-cross. Serves Win11 guests.
#   The linux assets are STATIC (couriered into stripped containers — the
#   exit-127 axis); freebsd/windows run in a full guest OS so are dynamic.
#
#   aeo CLI — NOT a bare binary: at runtime it reads AEO_HOME to find lib/ (it
#   cp's $AEO_HOME/lib into every composition build) and shells `ae` to compile.
#   So it ships a per-platform BUNDLE tarball (bin/aeo + share/aeo/{lib,examples,
#   bin/aeo,VERSION} + a COPY-ONLY install.sh that stages the tree + writes the
#   $PREFIX/bin/aeo AEO_HOME wrapper, no `make`, so it installs on a bare box).
#   get.sh (repo root) downloads + sha256-verifies the bundle and runs install.sh.
#   Three platform assets + .sha256:
#     cli-build-linux         x86_64
#     cli-build-linux-arm64   aarch64
#     cli-build-freebsd       x86_64 FreeBSD, zig-cross
#
# All build jobs install `ae` from source via get.sh, ASSERT each binary's
# arch/OS so an asset name can't lie, and self-gate/skip cleanly when the ae
# toolchain predates a needed fix. The release job downloads every produced
# artifact and publishes them under the one tag.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Optional: aether ref (tag/branch/sha) to build the toolchain from'
        required: false
        default: ''

permissions:
  contents: write        # create the release + upload the assets

jobs:
  # ===========================================================================
  # aeo-agent binaries (4 platforms)
  # ===========================================================================
  agent-build-linux:
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.sum.outputs.sha256 }}
    steps:
      - name: Checkout aeo
        uses: actions/checkout@v4

      - name: Install build prerequisites
        # libssl-dev + libnghttp2-dev provide the STATIC archives (libssl.a,
        # libcrypto.a, libnghttp2.a) the -static link needs.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential curl tar libssl-dev libnghttp2-dev

      - name: Install the Aether toolchain (ae)
        # get.sh builds ae from source (Aether -> C -> make); no chicken-and-egg.
        # AETHER_REF pins the toolchain version (input, else the latest tag).
        # Install to $HOME/.local (get.sh's default, user-writable — a PREFIX of
        # /usr/local needs root and 'install' fails "Operation not permitted" on the
        # runner), then add its bin to PATH for later steps.
        run: |
          curl -sSL https://raw.githubusercontent.com/aether-lang-org/aether/main/get.sh \
            | AETHER_REF="${{ github.event.inputs.ref }}" PREFIX="$HOME/.local" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify ae is on PATH
        run: ae --version

      - name: Build aeo-agent (linux, x86_64, static)
        # AE_CC carries the -static: ae hands it to the C-compile+link step.
        # (Proven locally: AE_CC="gcc -static" -> "not a dynamic executable",
        # and the result serves /health in debian-slim, alpine AND busybox.)
        run: |
          AE_CC="gcc -static" ae build bin/aeo-agent.ae -o aeo-agent-linux-x86_64-static --lib lib
          file aeo-agent-linux-x86_64-static
          # ASSERT the name is honest: the asset says linux-x86_64-static, so fail
          # the build if it isn't. Static == no interpreter, no runtime .so deps —
          # the exact axis a dynamic build silently breaks on (the exit-127 trap).
          file aeo-agent-linux-x86_64-static | grep -q 'ELF 64-bit.*x86-64' \
            || { echo "not an x86_64 ELF — asset name would be a lie"; exit 1; }
          file aeo-agent-linux-x86_64-static | grep -q 'statically linked' \
            || { echo "not statically linked — asset name would be a lie (the exit-127 trap returns)"; exit 1; }
          chmod +x aeo-agent-linux-x86_64-static

      - name: Checksum
        id: sum
        run: |
          sha256sum aeo-agent-linux-x86_64-static | tee aeo-agent-linux-x86_64-static.sha256
          echo "sha256=$(cut -d' ' -f1 aeo-agent-linux-x86_64-static.sha256)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aeo-agent-linux-x86_64-static
          path: |
            aeo-agent-linux-x86_64-static
            aeo-agent-linux-x86_64-static.sha256
          if-no-files-found: error

  agent-build-freebsd:
    # x86_64 FreeBSD, cross-compiled on the Linux runner. Runs bhyve guests.
    #
    # GATED on the aether toolchain carrying the FreeBSD-cross pthread fix
    # (tools/ae.c: link libthr.so.3 BY PATH in fbsd_link — -lpthread does NOT
    # resolve under zig-lld + -nostdlib against a split base sysroot). Without
    # that fix the link dies `undefined symbol: pthread_create`. Set
    # AEO_FREEBSD_MIN_AE to the first ae version that ships the fix and this job
    # SKIPS itself (with a clear note) on older toolchains rather than failing a
    # tag. Bump/remove the gate once that ae version is released & pinned.
    #
    # DYNAMIC (not static): links the base sysroot's libc.so.7 + libthr.so.3.
    # FreeBSD has no stable static-libc story the way musl/Alpine does; a bhyve
    # guest is a full FreeBSD userland, so the base libs are always present —
    # the static-in-busybox concern that drives the linux asset doesn't apply.
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.sum.outputs.sha256 }}
      built: ${{ steps.build.outputs.built }}
    env:
      # First ae version whose --target=x86_64-freebsd includes the libthr fix.
      # TODO: set to the real released version, then this gate self-clears.
      AEO_FREEBSD_MIN_AE: '0.428.0'
      CROSSBUILD_REPO: https://github.com/aether-lang-org/aether-crossbuild.git
    steps:
      - name: Checkout aeo
        uses: actions/checkout@v4

      - name: Install build prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential curl tar

      - name: Install the Aether toolchain (ae)
        run: |
          curl -sSL https://raw.githubusercontent.com/aether-lang-org/aether/main/get.sh \
            | AETHER_REF="${{ github.event.inputs.ref }}" PREFIX="$HOME/.local" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Gate on ae version (skip cleanly if the FreeBSD fix isn't in yet)
        id: gate
        run: |
          have=$(ae --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          need="$AEO_FREEBSD_MIN_AE"
          low=$(printf '%s\n%s\n' "$have" "$need" | sort -V | head -1)
          if [ "$have" != "$need" ] && [ "$low" = "$have" ]; then
            echo "ae $have < $need — FreeBSD cross fix (libthr.so.3) not in this toolchain; skipping FreeBSD asset."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ae $have >= $need — building FreeBSD asset."
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Provision the FreeBSD base sysroot + third-party deps (aether-crossbuild)
        if: steps.gate.outputs.ok == 'true'
        # The base sysroot (libc.so.7 + libthr.so.3 + CRT) is what zig lacks for
        # FreeBSD; the deps (openssl/zlib/pcre2) come from provision.sh. nghttp2
        # is intentionally omitted — it fails to cross-build for freebsd (gid_t
        # macro poisoning) AND the plaintext agent doesn't need it (no HTTP/2).
        run: |
          git clone --depth 1 "$CROSSBUILD_REPO" "$HOME/aether-crossbuild"
          cd "$HOME/aether-crossbuild"
          # zig is the cross-compiler provision.sh links with — it does NOT
          # auto-fetch it, so pull the pinned toolchain first (into ./toolchain/,
          # the dir added to PATH below).
          ./scripts/get-zig.sh
          ./scripts/fetch-freebsd-base.sh x86_64 15
          CB_LIBS="zlib pcre2 openssl" ./provision.sh x86_64-freebsd15
          echo "AETHER_SYSROOT=$HOME/aether-crossbuild/bases/x86_64-freebsd15" >> "$GITHUB_ENV"
          echo "CROSSBUILD_SYSROOT=$HOME/aether-crossbuild/sysroots/x86_64-freebsd15" >> "$GITHUB_ENV"
          echo "$HOME/aether-crossbuild/toolchain/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Build aeo-agent (freebsd, x86_64)
        id: build
        if: steps.gate.outputs.ok == 'true'
        run: |
          ae build bin/aeo-agent.ae -o aeo-agent-freebsd-x86_64 --lib lib --target=x86_64-freebsd
          file aeo-agent-freebsd-x86_64
          # ASSERT the name is honest: a real FreeBSD ELF for x86_64.
          file aeo-agent-freebsd-x86_64 | grep -q 'ELF 64-bit.*x86-64' \
            || { echo "not an x86_64 ELF — asset name would be a lie"; exit 1; }
          file aeo-agent-freebsd-x86_64 | grep -qi 'FreeBSD' \
            || { echo "not a FreeBSD binary — asset name would be a lie"; exit 1; }
          chmod +x aeo-agent-freebsd-x86_64
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Checksum
        id: sum
        if: steps.gate.outputs.ok == 'true'
        run: |
          sha256sum aeo-agent-freebsd-x86_64 | tee aeo-agent-freebsd-x86_64.sha256
          echo "sha256=$(cut -d' ' -f1 aeo-agent-freebsd-x86_64.sha256)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        if: steps.gate.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aeo-agent-freebsd-x86_64
          path: |
            aeo-agent-freebsd-x86_64
            aeo-agent-freebsd-x86_64.sha256
          if-no-files-found: error

  agent-build-windows:
    # x86_64 Windows, cross-compiled on the Linux runner via zig. Serves Win11
    # guests (bhyve; docs/development/aeo-agent-windows-pipeline.md). The agent's Windows
    # code path is real: it imports driver_windows and platform()-dispatches the
    # workload to `wsl -d <distro> -- podman ...` (bin/aeo-agent.ae ~320); the
    # linux arm uses podman directly. Same protocol/transport/boot core.
    #
    # NO crossbuild sysroot, NO base, NO version gate: Windows is Tier-A (zig
    # bundles the Windows CRT/libc), the agent is plaintext HTTP (no OpenSSL /
    # nghttp2 to link), and `ae --target=x86_64-windows` has shipped since 0.427.
    # So this is just: get ae, get zig, cross-build. Proven end-to-end: the .exe
    # runs on a real Win11 box and serves /health=ok.
    #
    # DYNAMIC vs the Windows system DLLs (kernel32/ws2_32/…) — always present in
    # any Windows guest; the static-in-busybox concern doesn't apply.
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.sum.outputs.sha256 }}
      built: ${{ steps.build.outputs.built }}
    env:
      ZIG_VERSION: '0.16.0'
    steps:
      - name: Checkout aeo
        uses: actions/checkout@v4

      - name: Install build prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential curl tar xz-utils

      - name: Install the Aether toolchain (ae)
        run: |
          curl -sSL https://raw.githubusercontent.com/aether-lang-org/aether/main/get.sh \
            | AETHER_REF="${{ github.event.inputs.ref }}" PREFIX="$HOME/.local" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install zig (the cross-compiler ae --target drives)
        run: |
          # Zig 0.16 renamed the archive: zig-<arch>-<os>-<ver> (was <os>-<arch>).
          zdir="zig-x86_64-linux-${ZIG_VERSION}"
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${zdir}.tar.xz" -o /tmp/zig.tar.xz
          tar -xJf /tmp/zig.tar.xz -C "$HOME"
          echo "$HOME/${zdir}" >> "$GITHUB_PATH"

      - name: Build aeo-agent (windows, x86_64)
        id: build
        # No CROSSBUILD_SYSROOT: the plaintext agent needs no OpenSSL/zlib/etc.,
        # and zig bundles the Windows CRT. -> a self-contained .exe.
        run: |
          ae build bin/aeo-agent.ae -o aeo-agent-windows-x86_64.exe --lib lib --target=x86_64-windows
          file aeo-agent-windows-x86_64.exe
          # ASSERT the name is honest: a real x86-64 Windows PE.
          file aeo-agent-windows-x86_64.exe | grep -q 'PE32+ executable' \
            || { echo "not a Windows PE — asset name would be a lie"; exit 1; }
          file aeo-agent-windows-x86_64.exe | grep -q 'x86-64' \
            || { echo "not x86-64 — asset name would be a lie"; exit 1; }
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Checksum
        id: sum
        run: |
          sha256sum aeo-agent-windows-x86_64.exe | tee aeo-agent-windows-x86_64.exe.sha256
          echo "sha256=$(cut -d' ' -f1 aeo-agent-windows-x86_64.exe.sha256)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aeo-agent-windows-x86_64
          path: |
            aeo-agent-windows-x86_64.exe
            aeo-agent-windows-x86_64.exe.sha256
          if-no-files-found: error

  agent-build-linux-arm64:
    # arm64 (aarch64) Linux, NATIVE-STATIC on a GitHub arm64 runner — NOT
    # cross-via-zig like the freebsd/windows jobs. Two reasons this asset must
    # follow the LINUX rule (native-static) and not the CROSS rule (zig-dynamic):
    #
    #   1. STATIC is load-bearing for the LINUX asset (both arches). The linux
    #      agent is the one couriered INTO containers in the recursive chain
    #      (debian-slim, musl Alpine, busybox). A dynamic build grows a
    #      libnghttp2.so.14 dep those bases don't ship -> exit 127, chain breaks
    #      (the exact trap the x86_64 static assertion guards). freebsd/windows are
    #      dynamic because they run in a FULL guest OS, not a stripped container —
    #      that exemption does NOT extend to linux-arm64.
    #   2. `ae build --target=aarch64-linux` yields a DYNAMIC binary and cannot go
    #      static via zig today (the ssl/crypto/z/nghttp2/pcre2 archives aren't
    #      staged for a static aarch64 link). Native gcc -static on an arm64 runner
    #      is the working static path — same as build-linux for x86_64.
    #
    # GATED on the ae toolchain carrying the cross-crypto HMAC fix (aether #1271 /
    # 141967f1). Before it, std.cryptography's HMAC stubbed to empty on any build
    # the zig path touched, and aeo's now-fail-CLOSED verifier makes such an agent
    # INERT (rejects every token). Native gcc -static with libssl-dev present links
    # a real HMAC, but the gate is belt-and-braces so a stale toolchain can't ship a
    # crypto-blind arm64 asset. Set AEO_ARM64_MIN_AE to the first released ae with
    # the fix; the job SKIPS cleanly on older toolchains rather than failing a tag.
    runs-on: ubuntu-24.04-arm
    outputs:
      sha256: ${{ steps.sum.outputs.sha256 }}
      built: ${{ steps.build.outputs.built }}
    env:
      # First RELEASED ae version carrying the cross-crypto HMAC fix (aether #1271
      # / 141967f1). The fix merged after 0.442.0 was cut; v0.443.0 (2026-07-25) is
      # the first published release that contains it (verified: `git merge-base
      # --is-ancestor 141967f1 v0.443.0`). Below this, std.cryptography's HMAC
      # stubbed to empty on the cross path and aeo's now-fail-closed verifier makes
      # the agent inert. (Belt-and-braces: a native gcc -static build with
      # libssl-dev present links a real HMAC regardless, but the gate stops a
      # pre-fix toolchain from ever shipping a crypto-blind => inert arm64 asset.)
      AEO_ARM64_MIN_AE: '0.443.0'
    steps:
      - name: Checkout aeo
        uses: actions/checkout@v4

      - name: Install build prerequisites
        # libssl-dev + libnghttp2-dev provide the STATIC archives (libssl.a,
        # libcrypto.a, libnghttp2.a) the -static link needs — same as build-linux.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential curl tar libssl-dev libnghttp2-dev

      - name: Install the Aether toolchain (ae)
        run: |
          curl -sSL https://raw.githubusercontent.com/aether-lang-org/aether/main/get.sh \
            | AETHER_REF="${{ github.event.inputs.ref }}" PREFIX="$HOME/.local" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Gate on ae version (skip cleanly if the cross-crypto HMAC fix isn't in yet)
        id: gate
        run: |
          have=$(ae --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          need="$AEO_ARM64_MIN_AE"
          low=$(printf '%s\n%s\n' "$have" "$need" | sort -V | head -1)
          if [ "$have" != "$need" ] && [ "$low" = "$have" ]; then
            echo "ae $have < $need — cross-crypto HMAC fix (aether #1271) not in this toolchain; skipping arm64 asset (would ship crypto-blind => inert)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ae $have >= $need — building arm64 asset."
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build aeo-agent (linux, aarch64, static)
        id: build
        if: steps.gate.outputs.ok == 'true'
        # Native gcc -static on the arm64 runner — mirrors build-linux exactly. The
        # runner IS aarch64, so this is a native build, not a cross (no zig).
        run: |
          AE_CC="gcc -static" ae build bin/aeo-agent.ae -o aeo-agent-linux-aarch64-static --lib lib
          file aeo-agent-linux-aarch64-static
          # ASSERT the name is honest: aarch64 AND statically linked — the same two
          # lies the x86_64 job guards, on arm64.
          file aeo-agent-linux-aarch64-static | grep -q 'ELF 64-bit.*aarch64' \
            || { echo "not an aarch64 ELF — asset name would be a lie"; exit 1; }
          file aeo-agent-linux-aarch64-static | grep -q 'statically linked' \
            || { echo "not statically linked — asset name would be a lie (the exit-127 trap returns)"; exit 1; }
          chmod +x aeo-agent-linux-aarch64-static
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Checksum
        id: sum
        if: steps.gate.outputs.ok == 'true'
        run: |
          sha256sum aeo-agent-linux-aarch64-static | tee aeo-agent-linux-aarch64-static.sha256
          echo "sha256=$(cut -d' ' -f1 aeo-agent-linux-aarch64-static.sha256)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        if: steps.gate.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aeo-agent-linux-aarch64-static
          path: |
            aeo-agent-linux-aarch64-static
            aeo-agent-linux-aarch64-static.sha256
          if-no-files-found: error

  # ===========================================================================
  # aeo CLI bundles (3 platforms)
  # ===========================================================================
  cli-build-linux:
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.sum.outputs.sha256 }}
    steps:
      - name: Checkout aeo
        uses: actions/checkout@v4

      - name: Install build prerequisites
        # libbrotli-dev provides the libbrotlienc.so / libbrotlicommon.so linker
        # symlinks: ae's link line for the CLI pulls them in via libcurl (built
        # with brotli), and a clean ubuntu-latest runner doesn't ship them, so the
        # link dies `cannot find -lbrotlienc`. (Not a static-archive issue — the
        # dynamic link needs them too.)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential curl tar zip libbrotli-dev

      - name: Install the Aether toolchain (ae)
        run: |
          curl -sSL https://raw.githubusercontent.com/aether-lang-dev/aether/main/get.sh \
            | AETHER_REF="${{ github.event.inputs.ref }}" PREFIX="$HOME/.local" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify ae is on PATH
        run: ae --version

      - name: Build aeo CLI (linux, x86_64)
        # DYNAMIC on purpose (unlike aeo-agent, which is static because it's
        # couriered into stripped busybox containers). The aeo CLI runs on a
        # normal host and ALREADY requires `ae` on PATH at runtime, so a dynamic
        # link against the host's system libs is fine — and a `-static` link
        # would need static archives for libcurl's whole transitive closure
        # (brotli, etc.) for zero benefit. --lib lib compiles the runner in.
        run: |
          ae build bin/aeo.ae -o bin/aeo --lib lib
          file bin/aeo
          file bin/aeo | grep -q 'ELF 64-bit.*x86-64' \
            || { echo "not an x86_64 ELF — asset name would be a lie"; exit 1; }
          chmod +x bin/aeo

      - name: Assemble the aeo-linux-x86_64 bundle
        id: bundle
        run: sh .github/scripts/assemble-aeo-bundle.sh linux x86_64

      - name: Checksum
        id: sum
        run: |
          cd dist
          sha256sum aeo-linux-x86_64.tar.gz | tee aeo-linux-x86_64.tar.gz.sha256
          echo "sha256=$(cut -d' ' -f1 aeo-linux-x86_64.tar.gz.sha256)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aeo-linux-x86_64
          path: |
            dist/aeo-linux-x86_64.tar.gz
            dist/aeo-linux-x86_64.tar.gz.sha256
          if-no-files-found: error

  cli-build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    outputs:
      sha256: ${{ steps.sum.outputs.sha256 }}
      built: ${{ steps.build.outputs.built }}
    env:
      # First released ae with the cross-crypto HMAC fix the agent gates on;
      # the CLI shares the toolchain floor. Skips cleanly on older ae.
      AEO_ARM64_MIN_AE: '0.443.0'
    steps:
      - name: Checkout aeo
        uses: actions/checkout@v4

      - name: Install build prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential curl tar zip

      - name: Install the Aether toolchain (ae)
        run: |
          curl -sSL https://raw.githubusercontent.com/aether-lang-dev/aether/main/get.sh \
            | AETHER_REF="${{ github.event.inputs.ref }}" PREFIX="$HOME/.local" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Gate on ae version (skip cleanly if the cross-crypto fix isn't in yet)
        id: gate
        run: |
          have=$(ae --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          need="$AEO_ARM64_MIN_AE"
          low=$(printf '%s\n%s\n' "$have" "$need" | sort -V | head -1)
          if [ "$have" != "$need" ] && [ "$low" = "$have" ]; then
            echo "ae $have < $need — skipping linux-arm64 asset."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build aeo CLI (linux, aarch64)
        id: build
        if: steps.gate.outputs.ok == 'true'
        # DYNAMIC (see build-linux) — the CLI needs `ae` on PATH anyway; no
        # static-archive closure to satisfy.
        run: |
          ae build bin/aeo.ae -o bin/aeo --lib lib
          file bin/aeo
          file bin/aeo | grep -q 'ELF 64-bit.*aarch64' \
            || { echo "not an aarch64 ELF — asset name would be a lie"; exit 1; }
          chmod +x bin/aeo
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Assemble the aeo-linux-aarch64 bundle
        if: steps.gate.outputs.ok == 'true'
        run: sh .github/scripts/assemble-aeo-bundle.sh linux aarch64

      - name: Checksum
        id: sum
        if: steps.gate.outputs.ok == 'true'
        run: |
          cd dist
          sha256sum aeo-linux-aarch64.tar.gz | tee aeo-linux-aarch64.tar.gz.sha256
          echo "sha256=$(cut -d' ' -f1 aeo-linux-aarch64.tar.gz.sha256)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        if: steps.gate.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aeo-linux-aarch64
          path: |
            dist/aeo-linux-aarch64.tar.gz
            dist/aeo-linux-aarch64.tar.gz.sha256
          if-no-files-found: error

  cli-build-freebsd:
    # x86_64 FreeBSD, cross-compiled via zig on the Linux runner. Same sysroot
    # provisioning + gate as the agent's freebsd job.
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.sum.outputs.sha256 }}
      built: ${{ steps.build.outputs.built }}
    env:
      # 0.646.0 is the release carrying the FreeBSD tier-2 cross-link fix under
      # Zig 0.16 (aether PR #1930: link staged libs by absolute path, only when
      # used). Below it the aeo CLI's OpenSSL-pulling cross-link dies `error:
      # libc not available`, so the job skips cleanly on an older ae.
      AEO_FREEBSD_MIN_AE: '0.646.0'
      CROSSBUILD_REPO: https://github.com/aether-lang-dev/aether-crossbuild.git
    steps:
      - name: Checkout aeo
        uses: actions/checkout@v4

      - name: Install build prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential curl tar zip

      - name: Install the Aether toolchain (ae)
        run: |
          curl -sSL https://raw.githubusercontent.com/aether-lang-dev/aether/main/get.sh \
            | AETHER_REF="${{ github.event.inputs.ref }}" PREFIX="$HOME/.local" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Gate on ae version (skip cleanly if the FreeBSD cross fix isn't in yet)
        id: gate
        run: |
          have=$(ae --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          need="$AEO_FREEBSD_MIN_AE"
          low=$(printf '%s\n%s\n' "$have" "$need" | sort -V | head -1)
          if [ "$have" != "$need" ] && [ "$low" = "$have" ]; then
            echo "ae $have < $need — skipping FreeBSD asset."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Provision the FreeBSD base sysroot + third-party deps
        id: provision
        if: steps.gate.outputs.ok == 'true'
        # NON-BLOCKING, like the build step below: a crossbuild-kit hiccup (e.g. a
        # third-party lib whose ./configure breaks under a new zig) must degrade to
        # "skip the FreeBSD asset", not red the whole release.
        continue-on-error: true
        run: |
          git clone --depth 1 "$CROSSBUILD_REPO" "$HOME/aether-crossbuild"
          cd "$HOME/aether-crossbuild"
          ./scripts/get-zig.sh
          ./scripts/fetch-freebsd-base.sh x86_64 15
          # CB_LIBS is only what the aeo CLI actually links on FreeBSD: openssl
          # (std.cryptography via secrets) + zlib (via libcurl). NOT pcre2 — the
          # CLI imports no std.regex (verified: ldd shows only libcrypto), and
          # pcre2's cross-configure is currently broken under zig 0.16. Adding a
          # lib the binary never links only buys failure modes.
          CB_LIBS="zlib openssl" ./provision.sh x86_64-freebsd15
          echo "AETHER_SYSROOT=$HOME/aether-crossbuild/bases/x86_64-freebsd15" >> "$GITHUB_ENV"
          echo "CROSSBUILD_SYSROOT=$HOME/aether-crossbuild/sysroots/x86_64-freebsd15" >> "$GITHUB_ENV"
          echo "$HOME/aether-crossbuild/toolchain/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Build aeo CLI (freebsd, x86_64, cross via zig)
        id: build
        # NB the `!cancelled() &&` prefix. The provision step above has
        # continue-on-error, which flips GitHub's IMPLICIT success() gate on
        # following steps to false — so a plain `if:` here SKIPS even when
        # provision genuinely succeeded (observed: run 34097040176). Leading with
        # a status function (!cancelled()) replaces that implicit gate with our
        # explicit condition, so the build runs iff the gate passed AND provision
        # actually succeeded — and this step has NO continue-on-error, so a real
        # build failure still reds the release.
        if: ${{ !cancelled() && steps.gate.outputs.ok == 'true' && steps.provision.outcome == 'success' }}
        # LOAD-BEARING. Proven green on ae 0.646.0 (dry run 34096660809: provision
        # -> build -> assemble -> upload all succeeded, aeo-freebsd-x86_64 bundle
        # produced). The old Zig-0.13-vs-0.16 cross-link failure is fixed upstream
        # (aether 0.646.0 / PR #1930) and the gate above ensures we only build on
        # that toolchain. No continue-on-error here now: a FreeBSD build failure is
        # a real regression and should red the release. (The PROVISION step above
        # stays tolerant — a crossbuild-KIT breakage is outside aeo's control and
        # cleanly skips the asset via the provision.outcome gate on this step.)
        run: |
          ae build bin/aeo.ae -o bin/aeo --lib lib --target=x86_64-freebsd
          file bin/aeo
          file bin/aeo | grep -q 'ELF 64-bit.*x86-64' \
            || { echo "not an x86_64 ELF — asset name would be a lie"; exit 1; }
          file bin/aeo | grep -qi 'FreeBSD' \
            || { echo "not a FreeBSD binary — asset name would be a lie"; exit 1; }
          chmod +x bin/aeo
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Assemble the aeo-freebsd-x86_64 bundle
        if: ${{ !cancelled() && steps.build.outputs.built == 'true' }}
        run: sh .github/scripts/assemble-aeo-bundle.sh freebsd x86_64

      - name: Checksum
        id: sum
        if: ${{ !cancelled() && steps.build.outputs.built == 'true' }}
        run: |
          cd dist
          sha256sum aeo-freebsd-x86_64.tar.gz | tee aeo-freebsd-x86_64.tar.gz.sha256
          echo "sha256=$(cut -d' ' -f1 aeo-freebsd-x86_64.tar.gz.sha256)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        if: ${{ !cancelled() && steps.build.outputs.built == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: aeo-freebsd-x86_64
          path: |
            dist/aeo-freebsd-x86_64.tar.gz
            dist/aeo-freebsd-x86_64.tar.gz.sha256
          if-no-files-found: error

  # ===========================================================================
  # ONE release carrying every produced asset (agent binaries + CLI bundles)
  # ===========================================================================
  release:
    needs:
      - agent-build-linux
      - agent-build-linux-arm64
      - agent-build-freebsd
      - agent-build-windows
      - cli-build-linux
      - cli-build-linux-arm64
      - cli-build-freebsd
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Summary (pin these SHA256s)
        run: |
          {
            if [ "${{ github.ref_type }}" = "tag" ]; then
              echo "### aeo ${{ github.ref_name }} released (agent + CLI)"
            else
              echo "### aeo BUILD-ONLY (workflow_dispatch dry run — not published)"
              echo ""
              echo "Cut a tag to publish: \`git tag vX.Y.Z && git push origin vX.Y.Z\`"
            fi
            echo ""
            echo "#### aeo-agent binaries"
            echo "| asset | SHA256 |"
            echo "|---|---|"
            echo "| \`aeo-agent-linux-x86_64-static\` | \`${{ needs.agent-build-linux.outputs.sha256 }}\` |"
            echo "| \`aeo-agent-windows-x86_64.exe\` | \`${{ needs.agent-build-windows.outputs.sha256 }}\` |"
            if [ "${{ needs.agent-build-linux-arm64.outputs.built }}" = "true" ]; then
              echo "| \`aeo-agent-linux-aarch64-static\` | \`${{ needs.agent-build-linux-arm64.outputs.sha256 }}\` |"
            else
              echo "| \`aeo-agent-linux-aarch64-static\` | _SKIPPED — ae predates the cross-crypto HMAC fix_ |"
            fi
            if [ "${{ needs.agent-build-freebsd.outputs.built }}" = "true" ]; then
              echo "| \`aeo-agent-freebsd-x86_64\` | \`${{ needs.agent-build-freebsd.outputs.sha256 }}\` |"
            else
              echo "| \`aeo-agent-freebsd-x86_64\` | _SKIPPED — ae predates the FreeBSD-cross pthread fix_ |"
            fi
            echo ""
            echo "#### aeo CLI bundles"
            echo "| asset | SHA256 |"
            echo "|---|---|"
            echo "| \`aeo-linux-x86_64.tar.gz\` | \`${{ needs.cli-build-linux.outputs.sha256 }}\` |"
            echo "| \`aeo-linux-aarch64.tar.gz\` | \`${{ needs.cli-build-linux-arm64.outputs.sha256 || '(skipped)' }}\` |"
            echo "| \`aeo-freebsd-x86_64.tar.gz\` | \`${{ needs.cli-build-freebsd.outputs.sha256 || '(skipped)' }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create the GitHub Release (tags only — immutable, versioned)
        # Publish ONLY on a real tag. workflow_dispatch builds + checksums but
        # does NOT publish — so there is never a rolling/overwritten asset; every
        # release is an immutable versioned tag. `files` globs whatever artifacts
        # the build jobs produced, so a skipped job simply omits its asset instead
        # of failing the release.
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/aeo-agent-linux-x86_64-static
            dist/aeo-agent-linux-x86_64-static.sha256
            dist/aeo-agent-linux-aarch64-static
            dist/aeo-agent-linux-aarch64-static.sha256
            dist/aeo-agent-windows-x86_64.exe
            dist/aeo-agent-windows-x86_64.exe.sha256
            dist/aeo-agent-freebsd-x86_64
            dist/aeo-agent-freebsd-x86_64.sha256
            dist/aeo-linux-x86_64.tar.gz
            dist/aeo-linux-x86_64.tar.gz.sha256
            dist/aeo-linux-aarch64.tar.gz
            dist/aeo-linux-aarch64.tar.gz.sha256
            dist/aeo-freebsd-x86_64.tar.gz
            dist/aeo-freebsd-x86_64.tar.gz.sha256
          fail_on_unmatched_files: false
          tag_name: ${{ github.ref_name }}
          body: |
            The whole of aeo — the `aeo` CLI and the in-guest `aeo-agent` — in one
            release, versioned in lockstep.

            ## aeo CLI (per-platform bundles)

            The `aeo` orchestrator CLI. Not a bare binary: it ships a bundle
            (bin/aeo + its runtime lib/ tree) with a copy-only installer.

            **Install (binary-first, sha256-verified):**
            ```sh
            curl -fsSL https://raw.githubusercontent.com/aether-lang-dev/aeo/main/get.sh | sh
            ```
            get.sh ensures `ae` + `aeb`, then downloads and verifies the bundle for
            your platform and installs a `~/.local/bin/aeo` wrapper that pins AEO_HOME.

            | bundle | platform |
            |---|---|
            | `aeo-linux-x86_64.tar.gz` | x86_64 Linux |
            | `aeo-linux-aarch64.tar.gz` | arm64 Linux |
            | `aeo-freebsd-x86_64.tar.gz` | x86_64 FreeBSD |

            Verify a bundle by hand:
            ```sh
            curl -fsSLO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/aeo-linux-x86_64.tar.gz
            curl -fsSL  https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/aeo-linux-x86_64.tar.gz.sha256 | sha256sum -c
            ```

            ## aeo-agent (in-guest binaries)

            The in-guest orchestration agent a guest fetches via cloud-init (or ssh
            push) to complete its node and run its workload.

            | asset | guest | linkage |
            |---|---|---|
            | `aeo-agent-linux-x86_64-static` | any x86_64 Linux (full OS, debian-slim, Alpine/musl, busybox) | STATIC — no runtime .so deps |
            | `aeo-agent-linux-aarch64-static` | any arm64 Linux (full OS, debian-slim, Alpine/musl, busybox; Raspberry Pi 5, arm64 guests) | STATIC — no runtime .so deps |
            | `aeo-agent-windows-x86_64.exe` | Windows (Win11 bhyve guests; workload via WSL2+podman) | dynamic vs Windows system DLLs (always present) |
            | `aeo-agent-freebsd-x86_64` | FreeBSD (bhyve guests) | dynamic vs the base libc.so.7 + libthr.so.3 (always present in a FreeBSD userland) |

            SHA256s are printed in the run summary and in each `<asset>.sha256`.

            Verify + run in cloud-init (linux example):
            ```
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/aeo-agent-linux-x86_64-static -o /usr/local/bin/aeo-agent
            echo "${{ needs.agent-build-linux.outputs.sha256 }}  /usr/local/bin/aeo-agent" | sha256sum -c -
            chmod +x /usr/local/bin/aeo-agent
            ```
